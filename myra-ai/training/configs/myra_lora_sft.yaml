### Model Arguments
model_name_or_path: Qwen/Qwen2.5-Math-1.5B-Instruct
trust_remote_code: true

### Method Arguments
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### Dataset Arguments
dataset: myra_math
template: qwen
cutoff_len: 1024
max_samples: 2500
overwrite_cache: true
preprocessing_num_workers: 4

### Output Arguments
output_dir: saves/myra-math-qwen-lora
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### Training Arguments
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false
fp16: true
ddp_timeout: 180000000
